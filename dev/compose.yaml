name: company-helper-crm-dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?generated dev credentials required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated dev credentials required}
      POSTGRES_DB: company_helper_twenty_dev
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d company_helper_twenty_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  redis-data:
